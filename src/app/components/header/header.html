<header class="topbar">
    <a href="#home" class="brand">
        <span>SC</span>
        <small>BUILT ON THE FRONTIER</small>
    </a>

    <nav aria-label="Main navigation">
        <a href="#about">Story</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Work</a>
        <a href="#contact">Contact</a>
    </nav>


    <button class="music-toggle" type="button" (click)="muteToggle.emit()"
        [attr.aria-label]="isMuted() ? 'Unmute music' : 'Mute music'" [attr.aria-pressed]="isMuted()"
        title="Toggle background music">
        @if (isMuted()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l8 4V5Z" />
            <path d="m17 9 4 6m0-6-4 6" />
        </svg>
        } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l8 4V5Z" />
            <path d="M16 9a5 5 0 0 1 0 6" />
            <path d="M19 5a10 10 0 0 1 0 14" />
        </svg>
        }
    </button>


    <a class="round-link" href="#contact" aria-label="Start a conversation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17L17 7" />
            <path d="M7 7H17V17" />
        </svg>
    </a>
</header>
